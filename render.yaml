# Render Blueprint - deploy backend Cinestar (free plan)
# Render sẽ đọc file này khi tạo "New Blueprint Instance"
services:
  - type: web
    name: cinestar-backend
    runtime: docker
    rootDir: javabackend
    plan: free
    healthCheckPath: /api/v1/movies/now-showing
    envVars:
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: JWT_SECRET
        sync: false          # điền chuỗi bí mật ≥ 32 ký tự khi tạo
      - key: DB_URL          # ví dụ Neon: jdbc:postgresql://ep-xxx.neon.tech/neondb?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST      # Upstash Redis host
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: SPRING_DATA_REDIS_PASSWORD   # Upstash password
        sync: false
      - key: SPRING_DATA_REDIS_SSL_ENABLED
        value: "true"
      # Kafka: bật khi có Upstash Kafka; trước mắt tắt listener để khỏi spam log
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: SPRING_KAFKA_LISTENER_AUTO_STARTUP
        value: "false"
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_RETURN_URL
        sync: false          # https://<ten-web>.vercel.app/payment/result
      - key: VNPAY_IPN_URL
        sync: false          # https://cinestar-backend.onrender.com/api/v1/payments/vnpay/ipn
